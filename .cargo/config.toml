# CachyOS & High-Performance Compilation Flags

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=x86-64-v3", # Enable AVX2, FMA, BMI1, BMI2 (CachyOS standard)
    "-C", "link-arg=-Wl,--as-needed",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
